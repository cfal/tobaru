[package]
name = "tobaru"
version = "0.9.6"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Port forwarding CLI utility written in Rust with allowlists, TLS SNI and ALPN routing, HTTP forwarding, load balancing, IP-to-destination mapping, and iptables support."
homepage = "https://github.com/cfal/tobaru/"
repository = "https://github.com/cfal/tobaru/"
readme = "README.md"
keywords = ["tunnel", "proxy", "forward", "port", "http"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
async-trait = "~0.1.92"
aws-lc-rs = { version = "~1.18.1", default-features = false }
env_logger = "~0.11.11"
futures = "~0.3.34"
ipnet = "~2.12.2"
log = { version = "~0.4.34", features = ["release_max_level_info"] }
parking_lot = "~0.12.5"
percent-encoding = "~2.3.2"
rustls = { version = "~0.23.45", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12"] }
serde = { version = "~1.0.229", features = ["derive", "std"] }
serde_json = "~1.0.151"
serde_yaml = "~0.9.34"
tokio = { version = "~1.53.2", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "~0.26.6", default-features = false, features = ["logging", "tls12", "aws_lc_rs"] }
ip_network_table-deps-treebitmap = "~0.5.0"
url = "~2.5.8"
webpki-roots = { version = "~1.0.9" }
notify = "~8.2.0"
radix_trie = { version = "~0.3.0", features = ["serde"] }
rand = "~0.10.3"
memchr = "~2.8.3"
# No registry version: packaging must not silently discard receive-validation fixes.
h2 = { path = "vendor/h2" }
http = "~1.4.0"
bytes = "~1.12.1"
mime_guess = "~2.0.5"
socket2 = "~0.6.5"

[dev-dependencies]
rcgen = { version = "~0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { version = "~1.53.2", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "fat"
strip = true
